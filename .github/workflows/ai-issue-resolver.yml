name: AI Issue Resolver

on:
  issues:
    types: [labeled]

jobs:
  develop-feature:
    if: github.event.label.name == 'ai-develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install openai

      - name: Run AI Feature Coder
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python ai_engineer/issue_resolver.py

      - name: Create Pull Request with Feature
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.REPO_PAT }}
          title: "🚀 AI Feature: ${{ github.event.issue.title }}"
          body: "Closes #${{ github.event.issue.number }}. This PR was automatically generated by the AI Feature Developer based on the issue description."
          branch: "ai/feature-${{ github.event.issue.number }}"
          labels: "ai-feature, automated pr"
          commit-message: "feat: automatically implemented issue requirements"